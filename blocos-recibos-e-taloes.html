<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Blocos Recibos e Talões</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Blocos Recibos e Talões</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Blocos Recibos e Talões/Bloco Numerado com Canhoto.jpg" alt="Bloco Numerado com Canhoto">
            <div>Bloco Numerado com Canhoto</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Bloco com Vias.jpg" alt="Bloco com Vias">
            <div>Bloco com Vias</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Bloco de Notas.jpg" alt="Bloco de Notas">
            <div>Bloco de Notas</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Bloco de Rascunho.jpg" alt="Bloco de Rascunho">
            <div>Bloco de Rascunho</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Comandas.jpg" alt="Comandas">
            <div>Comandas</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Receituário.jpg" alt="Receituário">
            <div>Receituário</div>
        </div>
        <div class="card">
            <img src="Blocos Recibos e Talões/Recibos.jpg" alt="Recibos">
            <div>Recibos</div>
        </div>
    </div>
</body>
</html>
