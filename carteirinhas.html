<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carteirinhas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Carteirinhas</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Carteirinhas/Carteirinha Dados Variáveis.jpg" alt="Carteirinha Dados Variáveis">
            <div>Carteirinha Dados Variáveis</div>
        </div>
        <div class="card">
            <img src="Carteirinhas/Carteirinha com Arte Variável.jpg" alt="Carteirinha com Arte Variável">
            <div>Carteirinha com Arte Variável</div>
        </div>
        <div class="card">
            <img src="Carteirinhas/Carteirinha com Arte Θnica.jpg" alt="Carteirinha com Arte Θnica">
            <div>Carteirinha com Arte Θnica</div>
        </div>
        <div class="card">
            <img src="Carteirinhas/Carteirinha com Tarja Magnética.jpg" alt="Carteirinha com Tarja Magnética">
            <div>Carteirinha com Tarja Magnética</div>
        </div>
    </div>
</body>
</html>
