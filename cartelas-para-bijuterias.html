<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cartelas para Bijuterias</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Cartelas para Bijuterias</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Cartelas para Bijuterias/Cartelas 10x15cm.jpg" alt="Cartelas 10x15cm">
            <div>Cartelas 10x15cm</div>
        </div>
        <div class="card">
            <img src="Cartelas para Bijuterias/Cartelas 18x5cm.jpg" alt="Cartelas 18x5cm">
            <div>Cartelas 18x5cm</div>
        </div>
        <div class="card">
            <img src="Cartelas para Bijuterias/Cartelas 4x5cm.jpg" alt="Cartelas 4x5cm">
            <div>Cartelas 4x5cm</div>
        </div>
        <div class="card">
            <img src="Cartelas para Bijuterias/Cartelas 9x5cm.jpg" alt="Cartelas 9x5cm">
            <div>Cartelas 9x5cm</div>
        </div>
    </div>
</body>
</html>
