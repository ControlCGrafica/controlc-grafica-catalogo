<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Carimbos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Carimbos</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Carimbos/Acessórios para Carimbos.jpg" alt="Acessórios para Carimbos">
            <div>Acessórios para Carimbos</div>
        </div>
        <div class="card">
            <img src="Carimbos/Carimbo Automático Nykon.jpg" alt="Carimbo Automático Nykon">
            <div>Carimbo Automático Nykon</div>
        </div>
        <div class="card">
            <img src="Carimbos/Carimbo Automático Trodat.jpg" alt="Carimbo Automático Trodat">
            <div>Carimbo Automático Trodat</div>
        </div>
        <div class="card">
            <img src="Carimbos/Carimbo Chancela.jpg" alt="Carimbo Chancela">
            <div>Carimbo Chancela</div>
        </div>
        <div class="card">
            <img src="Carimbos/Carimbo de Madeira.jpg" alt="Carimbo de Madeira">
            <div>Carimbo de Madeira</div>
        </div>
        <div class="card">
            <img src="Carimbos/Carimbo para Roupas.jpg" alt="Carimbo para Roupas">
            <div>Carimbo para Roupas</div>
        </div>
    </div>
</body>
</html>
