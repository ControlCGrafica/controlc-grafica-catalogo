<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quadros e Decorações</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Quadros e Decorações</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Quadros e Decorações/Moldura Fina.jpg" alt="Moldura Fina">
            <div>Moldura Fina</div>
        </div>
        <div class="card">
            <img src="Quadros e Decorações/Moldura Grossa.jpg" alt="Moldura Grossa">
            <div>Moldura Grossa</div>
        </div>
        <div class="card">
            <img src="Quadros e Decorações/Quadros em MDF 3mm.jpg" alt="Quadros em MDF 3mm">
            <div>Quadros em MDF 3mm</div>
        </div>
        <div class="card">
            <img src="Quadros e Decorações/Quadros em MDF 6mm.jpg" alt="Quadros em MDF 6mm">
            <div>Quadros em MDF 6mm</div>
        </div>
    </div>
</body>
</html>
