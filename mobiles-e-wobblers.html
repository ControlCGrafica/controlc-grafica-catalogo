<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Móbiles e Wobblers</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Móbiles e Wobblers</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Móbiles e Wobblers/Móbile Natal.jpg" alt="Móbile Natal">
            <div>Móbile Natal</div>
        </div>
        <div class="card">
            <img src="Móbiles e Wobblers/Móbile Octogonal.jpg" alt="Móbile Octogonal">
            <div>Móbile Octogonal</div>
        </div>
        <div class="card">
            <img src="Móbiles e Wobblers/Móbile Redondo.jpg" alt="Móbile Redondo">
            <div>Móbile Redondo</div>
        </div>
        <div class="card">
            <img src="Móbiles e Wobblers/Móbile Tipo U.jpg" alt="Móbile Tipo U">
            <div>Móbile Tipo U</div>
        </div>
        <div class="card">
            <img src="Móbiles e Wobblers/Wobbler Faca Especial.jpg" alt="Wobbler Faca Especial">
            <div>Wobbler Faca Especial</div>
        </div>
        <div class="card">
            <img src="Móbiles e Wobblers/Wobbler.jpg" alt="Wobbler">
            <div>Wobbler</div>
        </div>
    </div>
</body>
</html>
