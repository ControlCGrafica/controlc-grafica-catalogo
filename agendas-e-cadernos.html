<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agendas e Cadernos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Agendas e Cadernos</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Agendas e Cadernos/Agenda Diária.jpg" alt="Agenda Diária">
            <div>Agenda Diária</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Agenda Dois Dias por Página.jpg" alt="Agenda Dois Dias por Página">
            <div>Agenda Dois Dias por Página</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Agenda Permanente.jpg" alt="Agenda Permanente">
            <div>Agenda Permanente</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Agenda Planner.jpg" alt="Agenda Planner">
            <div>Agenda Planner</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Agenda Semanal.jpg" alt="Agenda Semanal">
            <div>Agenda Semanal</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Caderno Grande.jpg" alt="Caderno Grande">
            <div>Caderno Grande</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Caderno Pequeno.jpg" alt="Caderno Pequeno">
            <div>Caderno Pequeno</div>
        </div>
        <div class="card">
            <img src="Agendas e Cadernos/Miolo para Agendas.jpg" alt="Miolo para Agendas">
            <div>Miolo para Agendas</div>
        </div>
    </div>
</body>
</html>
