<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sacolas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Sacolas</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Sacolas/Alta 9x9x395cm.jpg" alt="Alta 9x9x395cm">
            <div>Alta 9x9x395cm</div>
        </div>
        <div class="card">
            <img src="Sacolas/Extra Grande 515x12x40cm.jpg" alt="Extra Grande 515x12x40cm">
            <div>Extra Grande 515x12x40cm</div>
        </div>
        <div class="card">
            <img src="Sacolas/Extra Pequena 12x6x12cm.jpg" alt="Extra Pequena 12x6x12cm">
            <div>Extra Pequena 12x6x12cm</div>
        </div>
        <div class="card">
            <img src="Sacolas/Grande 39x95x2775cm.jpg" alt="Grande 39x95x2775cm">
            <div>Grande 39x95x2775cm</div>
        </div>
        <div class="card">
            <img src="Sacolas/Média 21x10x315cm.jpg" alt="Média 21x10x315cm">
            <div>Média 21x10x315cm</div>
        </div>
        <div class="card">
            <img src="Sacolas/Pequena 15x7x21cm.jpg" alt="Pequena 15x7x21cm">
            <div>Pequena 15x7x21cm</div>
        </div>
    </div>
</body>
</html>
