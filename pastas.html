<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pastas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Pastas</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Pastas/Bolsa Personalizada.jpg" alt="Bolsa Personalizada">
            <div>Bolsa Personalizada</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta A5.jpg" alt="Pasta A5">
            <div>Pasta A5</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta com Orelha e Janela.jpg" alt="Pasta com Orelha e Janela">
            <div>Pasta com Orelha e Janela</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta com Orelha.jpg" alt="Pasta com Orelha">
            <div>Pasta com Orelha</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta com Vinco.jpg" alt="Pasta com Vinco">
            <div>Pasta com Vinco</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta para Contrato.jpg" alt="Pasta para Contrato">
            <div>Pasta para Contrato</div>
        </div>
        <div class="card">
            <img src="Pastas/Pasta para Exames.jpg" alt="Pasta para Exames">
            <div>Pasta para Exames</div>
        </div>
    </div>
</body>
</html>
