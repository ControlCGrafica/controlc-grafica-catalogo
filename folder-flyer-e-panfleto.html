<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Folder Flyer e Panfleto</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Folder Flyer e Panfleto</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Folder Flyer e Panfleto/Flyer.jpg" alt="Flyer">
            <div>Flyer</div>
        </div>
        <div class="card">
            <img src="Folder Flyer e Panfleto/Folder 1 Dobra.jpg" alt="Folder 1 Dobra">
            <div>Folder 1 Dobra</div>
        </div>
        <div class="card">
            <img src="Folder Flyer e Panfleto/Folder 2 Dobras.jpg" alt="Folder 2 Dobras">
            <div>Folder 2 Dobras</div>
        </div>
        <div class="card">
            <img src="Folder Flyer e Panfleto/Folder 3 Dobras.jpg" alt="Folder 3 Dobras">
            <div>Folder 3 Dobras</div>
        </div>
        <div class="card">
            <img src="Folder Flyer e Panfleto/Folder.jpg" alt="Folder">
            <div>Folder</div>
        </div>
        <div class="card">
            <img src="Folder Flyer e Panfleto/Panfleto.jpg" alt="Panfleto">
            <div>Panfleto</div>
        </div>
    </div>
</body>
</html>
