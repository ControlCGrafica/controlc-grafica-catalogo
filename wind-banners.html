<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Wind Banners</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Wind Banners</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Wind Banners/Acessórios para Wind Banners.jpg" alt="Acessórios para Wind Banners">
            <div>Acessórios para Wind Banners</div>
        </div>
        <div class="card">
            <img src="Wind Banners/Bandeira para Wind Banner.jpg" alt="Bandeira para Wind Banner">
            <div>Bandeira para Wind Banner</div>
        </div>
        <div class="card">
            <img src="Wind Banners/Gigante  Altura Montado 350m.jpg" alt="Gigante  Altura Montado 350m">
            <div>Gigante  Altura Montado 350m</div>
        </div>
        <div class="card">
            <img src="Wind Banners/Grande  Altura Montado 280m.jpg" alt="Grande  Altura Montado 280m">
            <div>Grande  Altura Montado 280m</div>
        </div>
        <div class="card">
            <img src="Wind Banners/Mini  Altura Montado 190m.jpg" alt="Mini  Altura Montado 190m">
            <div>Mini  Altura Montado 190m</div>
        </div>
        <div class="card">
            <img src="Wind Banners/Parede  Altura Montado 180m.jpg" alt="Parede  Altura Montado 180m">
            <div>Parede  Altura Montado 180m</div>
        </div>
    </div>
</body>
</html>
