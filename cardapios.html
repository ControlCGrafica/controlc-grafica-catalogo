<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardápios</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Cardápios</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Cardápios/Cardápio com Espiral.jpg" alt="Cardápio com Espiral">
            <div>Cardápio com Espiral</div>
        </div>
        <div class="card">
            <img src="Cardápios/Cardápio com Wireo.jpg" alt="Cardápio com Wireo">
            <div>Cardápio com Wireo</div>
        </div>
        <div class="card">
            <img src="Cardápios/Cardápio em PVC.jpg" alt="Cardápio em PVC">
            <div>Cardápio em PVC</div>
        </div>
        <div class="card">
            <img src="Cardápios/Cardápio em Papel.jpg" alt="Cardápio em Papel">
            <div>Cardápio em Papel</div>
        </div>
    </div>
</body>
</html>
