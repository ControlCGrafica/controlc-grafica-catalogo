<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Tags e Cartelas</title>

        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Tags e Cartelas</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Tags e Cartelas/Cartelas para Bijuterias.jpg" alt="Cartelas para Bijuterias">
            <div>Cartelas para Bijuterias</div>
        </div>
        <div class="card">
            <img src="Tags e Cartelas/Sacola para Bijuterias.jpg" alt="Sacola para Bijuterias">
            <div>Sacola para Bijuterias</div>
        </div>
        <div class="card">
            <img src="Tags e Cartelas/Tag para Roupa.jpg" alt="Tag para Roupa">
            <div>Tag para Roupa</div>
        </div>
        <div class="card">
            <img src="Tags e Cartelas/Tags Personalizadas.jpg" alt="Tags Personalizadas">
            <div>Tags Personalizadas</div>
        </div>
        <div class="card">
            <img src="Tags e Cartelas/Tags para Garrafa.jpg" alt="Tags para Garrafa">
            <div>Tags para Garrafa</div>
        </div>
        <div class="card">
            <img src="Tags e Cartelas/Tags.jpg" alt="Tags">
            <div>Tags</div>
        </div>
    </div>
</body>
</html>
