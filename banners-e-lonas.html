<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Banners e Lonas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        h1 { margin-bottom: 20px; }
        a { text-decoration: none; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; padding: 10px; }
        .card img { max-width: 100%; border-radius: 8px; height: 150px; object-fit: cover; }
    </style>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Banners e Lonas</h1>
    <div class="grid">
    
        <div class="card">
            <img src="Banners e Lonas/Backdrop.jpg" alt="Backdrop">
            <div>Backdrop</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Banner com Suporte Tripé.jpg" alt="Banner com Suporte Tripé">
            <div>Banner com Suporte Tripé</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Banner.jpg" alt="Banner">
            <div>Banner</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Cavalete de Ferro.jpg" alt="Cavalete de Ferro">
            <div>Cavalete de Ferro</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Cavalete de Madeira.jpg" alt="Cavalete de Madeira">
            <div>Cavalete de Madeira</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Faixas.jpg" alt="Faixas">
            <div>Faixas</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Lonas.jpg" alt="Lonas">
            <div>Lonas</div>
        </div>
        <div class="card">
            <img src="Banners e Lonas/Wind Banners.jpg" alt="Wind Banners">
            <div>Wind Banners</div>
        </div>
    </div>
</body>
</html>
